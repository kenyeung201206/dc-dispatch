<!doctype html><html><head><title>fixture</title></head><body><div id="root"></div><script>window.__PRELOADED_STATE__ = {"Updates":{"highlight":{"button":{"trackingValue":"4mrYiFPIyKpzpoqshDQk80 : [TD2] News - The Division 2: Red Horizon","buttonUrl":"/4mrYiFPIyKpzpoqshDQk80/the-division-2-red-horizon","trackingCategoryValue":"news","buttonType":"internal","commonTranslationId":"readMore"},"date":"Wed Aug 26 2026 16:45:00 GMT+0000 (Coordinated Universal Time)","placement":["featured-news-article-emea","featured-news-article-ncsa","featured-news-article"],"title":"The Division 2: Red Horizon","id":"4mrYiFPIyKpzpoqshDQk80","trackingPageValue":"[TD2] News - The Division 2: Red Horizon","categories":["the-division-2","the-division"],"content":"Gamescom gave us a lot to talk about this year. We shared more on what is ahead for The Division 2, including Crossplay, our next DLC, a first tease of Season 4, and, of course, Red Horizon. If you missed the panel, you can catch up on everything we covered [HERE](https://thedivision2.com/gamescom-2026-recap-panel-1). \n\nNow it is time to turn our attention back to Washington, D.C., where the Cleaners are making themselves very much at home. \n\nSo, grab a cup of Kerman Coffee, get comfortable, and let’s get into everything waiting for you in Red Horizon. \n\n# CONTENTS \n- [Modifiers](#1) \n- [New Weapons, Gear, and Talents](#2) \n- [Retaliation](#3) \n- [Dark Zone and PvP](#4) \n- [QoL & Other Updates](#5) \n- [Classified Assignments](#6) \n- [Season Pass](#7) \n- [Red Horizon Bundle and Supply Drop](#8) \n- [One Time Offer](#9) \n\n# MODIFIERS {#1}\n\n![[TD2] News - The Division 2: Red Horizon- EDIT - 1. RedHorizon Modifiers upd](//staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/1NUXOJE8QAuErmFSuN06x6/7dc150eb2e3699f0d8d9adad8214680f/1._RedHorizon_Modifiers_upd.jpg)\n\nThe Cleaners are moving into Washington, D.C., and their presence will be hard to miss. They are becoming the main threat in Retaliations this season, with 95 Company Elite Squad becoming part of the threat. \n\nTheir growing presence sets the stage for this season’s Modifiers, and the heat does not stop with the Cleaners. \n\n# GLOBAL MODIFIER: UNDER PRESSURE \n\nUnder Pressure revolves around a Pressure Gauge that builds as you fight. Kills, headshots, multikills, Skill kills, Status Effect kills, fire kills, and kills made by other players in your group all contribute to the Gauge.  \n\nThe more Pressure you build, the stronger the bonuses you receive. \n\nBy default, the Pressure Gauge provides Status Effects as its primary bonus. If Status Effects are not what your build needs, some Passive Modifiers can replace the Gauge's primary bonus with Signature Weapon Damage or Hazard Protection instead. \n\n## ACTIVE MODIFIERS \n\nYour Pressure Gauge is also used to activate one of the season's three Active Modifiers.  \n\nUnlike previous seasons, this time Active Modifiers do not have a general cooldown. Once you have enough Pressure, you can activate one when you need it. The Gauge resets once the Active Modifier ends. \n\n### FIERY AURA \n- **Secondary Attribute: Armor Regen.**\n- While active, it gives you increased Armor Regen and Damage Resistance, with additional protection while sprinting. Enemies that get close to you are also set on fire the first time they enter the Modifier's range. \n- At higher levels, its defensive bonuses become stronger, and burning unique enemies can also regenerate Bonus Armor. \n\n### VICARIOUS COMBUSTION  \n- **Secondary Attribute: Headshot Damage.**\n- Landing a headshot on an enemy that is already burning also applies Burn to nearby enemies. As the Modifier levels up, this effect reaches a larger area. \n- At its highest level, headshots can apply Burn directly. \n\n### SIGNED, SHIELD, DELIVERED  \n- **Secondary Attribute: Skill Efficiency.**   \n- While active, it improves your Signature Weapon performance, Shield Health, and Shield Active Regen. Kills made with a Signature Weapon, or while using a shield, refill your magazine without consuming ammo from your reserves. \n- At its highest level, these kills can also extend the duration of the Active Modifier. \n\n## PASSIVE MODIFIERS \n\nRed Horizon comes with **20 Passive Modifiers**, and they can help you adjust how Under Pressure works with your build. \n\nSome can help you build Pressure faster or hold onto it for longer, others add new interactions with fire, Skills, grenades, shields, and Signature Weapons. \n\nThe default primary bonus of the Pressure Gauge is Status Effects, but with Passive Modifiers like New Formula: Beta and New Formula: Gamma, you can swap it for Signature Weapon Damage or Hazard Protection. \n\n## HOSTILE MODIFIERS \n\nHostile Modifiers will also play into the Pressure Gauge this season, with enemies able to drain your Pressure or make certain actions work against you. \n\nSetting an affected enemy on fire is the only way to permanently remove or reverse the effect. \n\n- **Draining Presence** drains ammunition from your magazine and reduces your Pressure while the affected enemy is close to you. \n- **Achilles' Heal** restores Health to the affected enemy and nearby allies when you break their weak points or armor pieces, while also reducing your Pressure. \n- **Thousand Cuts** reduces your Pressure whenever the affected enemy hits you and applies a stacking Damage Reduction debuff. \n\n# NEW WEAPONS, GEAR, AND TALENTS {#2}\n\n## GEAR AND BRAND SET UPDATES \n\nFor Gear Sets, we are continuing to rebalance them around the idea that the more difficult a set is to use at its full potential, the more it should give back in return. \n\nFor Red Horizon, the updates focus mostly on Red Core Gear Sets, with Ortiz: Exuro and True Patriot also included. Blue and Yellow Core Gear Sets will be addressed in future updates. \n\nBrand Sets are also getting some changes. Bonuses such as **Shock Resistance, Health, Incoming Repairs, and Swap Speed** are being removed, and **Protection from Elites** now added as a new Brand Set bonus. \n\nWe have also reorganized weapon bonuses so that, for each weapon type, at least one Brand offers that bonus as its 1-piece bonus and another as its 2-piece bonus. \n\nYou can find the full breakdown of all Gear Set and Brand Set changes [**HERE**](https://ubi.li/4Yvr2). \n\nThere’s also one broader change to how we’ll handle Brand Sets going forward. Starting with Red Horizon, instead of adding new Brand Sets, we’ll add more **Named pieces with Perfect Talents or Attributes to existing Brands.** \n\n## WEAPON UPDATES \n\n**Steel & Sons ACR**\n- Base Stability has been increased, reducing vertical coil. \n- Maximum stacks increased from 3 to 4. \n- Destroying an enemy weak point now causes them to take +30% Amplified Damage from you for 5s, up from 10%. \n\n## DETERMINED TALENT \n\n**Determined** will now function like **Perfect Determined**, meaning a kill from a converted headshot will no longer trigger another guaranteed headshot. \n\nThe ability to chain body shots as headshots is not going away completely. That functionality is moving to the new **Iron Will Exotic Chest** through its **Resolved Talent**. Iron Will lets your next body shot count as a headshot without requiring a headshot kill first, and can be paired with Exotic MMRs or High-End MMRs using Talents other than Determined. \n\nTo support it, we are also buffing several MMR-related Gear Sets and Brand bonuses. \n\nFor more on the thinking behind the Determined changes, you can read our [Developer Notes](https://thedivision2.com/red-horizon-pts-devnotes).\n\n## NEW EXOTIC WEAPON\n\n|  |  |\n|:---|:---|\n| **Fafnir**<br>Exotic Shotgun | **Talent Dragon's Breath**<br><br>This weapon fires Dragon's Breath shells. Each shot has a 40% chance of applying Burn to the enemy.<br><br>Weapon Damage is Amplified by 50% of your Status Effect bonus.<br><br>**Weapon Stats and Mods**<br>Optics: +15% Crit Chance<br>Magazine: +5 Rounds<br>Underbarrel: +10% Weapon Handling<br><br>*Note: Fafnir’s Burn application is still affected by the usual Status Effect diminishing returns on enemies. Because of this, you may sometimes see Burn applied less often than the 40% chance would suggest.* |\n\n![-TD2- News - The Division 2 Red Horizon-2. Fafnir Exotic](//staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/42W9sEXgOTa79oAQBkl4M4/4023774af2962594e8cabf5b8cd7a6c0/-TD2-_News_-_The_Division_2_Red_Horizon-2._Fafnir_Exotic.jpg)\n\n## NEW EXOTIC GEAR \n\n|  |  |\n|:---|:---|\n| **Iron Will**<br>Exotic Chest | **Talent Resolved**<br><br>**PvE version:**<br><br>Your next body shot will be considered a headshot. Cooldown: 2s<br><br>**PvP version:**<br><br>Your next body shot will be considered a headshot. Cooldown: 3s<br><br>Requires MMR, Rifle or Pistol. |\n\n![[TD2] News - The Division 2: Red Horizon- EDIT - 3. Iron Will Exotic Chest upd](//staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/5DFs7v7d7j6RzBW6yMu3V3/2870ff8b00f0365355bf71168079b0cc/3._Iron_Will_Exotic_Chest_upd.jpg)\n\n## NEW GEAR \n\n|  |  |\n|:---|:---|\n| **Ember Engine**<br>Gear Set | **2 Pieces** equipped give 8% Skill Efficiency<br>**3 Pieces** equipped give 30% Status Effect<br>**4 Pieces** equipped unlock a new unique talent.<br><br>**Talent “Spontaneous Combustion”**<br><br>Every Status Effect you apply has a 40% chance of also applying Burn to the enemy.<br><br>If the Status Effect initially applied was Burn, the enemy will receive +25% Burn Damage for the duration of the Burn.<br><br>**Chest and Backpack Talents:**<br><br>**Chest Bonus - Talent “Flashpoint”**<br><br>Increase the chance of applying Burn of Spontaneous Combustion to 60%.<br><br>**Backpack Bonus – Talent “White Hot”**<br><br>Increase the Duration of the Burn Damage debuff of Spontaneous Combustion by 50%. |\n\n![-TD2- News - The Division 2 Red Horizon-4. Ember Engine Gear Set](//staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/7bt42NjzMJKw1z84BjTkO5/ad0c50b8811c12a05e8c16abfa95937a/-TD2-_News_-_The_Division_2_Red_Horizon-4._Ember_Engine_Gear_Set.jpg)\n\n## NEW NAMED GEAR\n\n|  |  |\n|:---|:---|\n| **Trick Shot**<br>Named Imminence Armaments Chest | **Talent Perfect Reassigned**<br><br>Killing an enemy adds 1 round of a random special ammo into your sidearm. Cooldown: 8s. |\n| **Rushdown**<br>Named Richter & Kaiser GmbH Chest | **Talent Tag Team**<br><br>The last enemy you have damaged with a skill is marked.<br><br>Dealing weapon damage to that enemy consumes the mark to reduce active cooldowns by 12s. Cooldown: 4s |\n| **Melon Baller**<br>Named Airaldi Holdings Backpack | **Talent Perfect Concussion**<br><br>Headshots increase total weapon damage by 20% for 1.5s. 5s with marksman rifles.<br><br>Headshot kills increase total weapon damage by 15% for 10s. |\n| **Keeper**<br>Named 5.11 Tactical Backpack | **Talent Perfect Protector**<br><br>When your shield is damaged, you gain +25% bonus armor and all other allies gain +35% of your armor as bonus armor for 3s. Cooldown: 3s |\n\n## NEW NAMED WEAPONS AND TALENTS\n\n|  |  |\n|:---|:---|\n| **Teapot** | **Talent Perfect Boiling Point**<br><br>The first 48% of your magazine will have -100% Critical Hit Chance. The rest will have 100%. |\n| **Steamer** | **Talent Perfect Boiling Point**<br><br>The first 48% of your magazine will have -100% Critical Hit Chance. The rest will have 100%. |\n| **Talent “Boiling Point”** | The first 53% of your magazine will have -100% Critical Hit Chance. The rest will have 100%. |\n\n# RETALIATION {#3}\n\nIt's been one year since Retaliation launched, and to mark the occasion, you'll be able to take on a special Project Chain from **September 8 to September 22**. \n\nThe objectives will send you back into Retaliations against different factions. Each completed Project comes with useful materials and caches, with an Outfit Token waiting at the end as the main reward. You can use it to unlock one eligible outfit of your choice from the store. \n\nAnd there’s more to earn during the first week. From **September 8 to September 15**, **Retaliation Surge** will be active, doubling the Retaliation Faction Materials you earn from all sources. \n\n# DARK ZONE AND PVP {#4}\n\nRed Horizon brings Blackout into the Dark Zone rotation, and Toxic DZ remains as a permanent PvE variant.  \n\nDark Zone variants will rotate weekly across DZ West, East, and South, with one PvE and two PvP Dark Zones available at any given time. Toxic and Balanced will remain active each week, while Blackout and Classic will alternate on a weekly basis. \n\n## TOXIC DARK ZONE \n\n![[TD2] News - The Division 2: Red Horizon - 5. Toxic Dark Zone](//staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/CW0gYHMCYzqrfxlxd78IM/4fd641a83501e00fe77273c703a74d26/5._Toxic_Dark_Zone.jpg)\n\nThe Toxic Dark Zone is here to stay. With the Into the Dark seasonal Modifiers no longer active, we have made a few changes so it can continue as a permanent PvE Dark Zone: \n- Other factions can now appear in the Toxic DZ, including Black Tusk. \n- Sample Canisters and Surge have been removed. \n- Toxicity has been adjusted, and extracting your gear will now clear your Toxicity level. \n- Normalization remains active to scale players and their gear to level 40. However, PvP-specific overrides for talents, Gear Sets, skills, and weapons are not active, meaning these will use their PvE values against enemies. Prototype Gear will remain normalized, similar to Raids and Incursions.\n\n### REWARDS \n\nLandmark chests in the Toxic Dark Zone now have 20% chance to drop a contaminated cache. These caches use the same special loot pool as the PvP Dark Zones, including Exclusive and Raid Gear Sets, legacy DZ-exclusive weapons, Named Items, and Exotic. \n\n## BLACKOUT DARK ZONE \n\n![[TD2] News - The Division 2: Red Horizon - 6. Blackout DarkZone](//staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/6jfnYqoen3wMciS02udlvO/8d695a79c00ecd153b197725071c43c9/6._Blackout_DarkZone.jpg)\n\n*(PvEvP / Non-Normalized / Global PvP Balance: Active / SHD & Expertise: Active / Rogue Protocol: Active)*  \n\nFor those of you who have been asking for a fully uncapped Dark Zone, **Blackout** is exactly that. It completely removes stat normalization, so you can use the full power of your build, including your SHD Watch and Expertise upgrades. \n\nThe zone is permanently Invaded, with Black Tusk as the main enemy faction, and you’ll also encounter tougher Veteran, Elite, and Named enemies. \n\n**Rogue Protocol** remains active, and **Global PvP Balance** still applies to weapons, gear, and Skills. **Prototype Gear and Weapons** can also use their full base stats in Blackout. Their Augments, however, will still use the PvP-balanced values. \n\n### REWARDS \n\nBlackout loot drops at **Heroic** quality, matching the other PvP Dark Zones. There is also a 20% chance to receive an additional contaminated item from the special Dark Zone loot pool, including Exclusive and Raid Gear Sets, legacy DZ-exclusive weapons, Named Items, and Exotic. \n\nWith Red Horizon, Ortiz: Reficere, Caduceus, and Nurse's Kneepads have also been added to the special loot pool for PvP Dark Zones. \n\nPrototype Gear and Weapons can also drop as contaminated loot from enemies, with stronger enemies offering better chances and higher stat rolls: \n- **Normal Enemies:** 0.2% Chance for Prototype Drop - Mid Stat Rolls \n- **Elite Enemies:** 0.5% Chance for Prototype Drop - Mid Stat Rolls & 0.2% Chance for Prototype Drop - High Stat Rolls \n- **Boss Enemies:** 1% Chance for Prototype Drop - Mid Stat Rolls and 2% Chance for Prototype Drop - High Stat Rolls. \n\nExotic Component drop rates match the other PvP Dark Zones: \n- **Challenging Landmark Phoenix Crates:** 33% \n- **Challenging Landmark Bosses:** 40% \n- **Heroic Landmark Phoenix Crates:** 40% \n- **Heroic Landmark Bosses:** 48% \n\n## GLOBAL PVP BALANCE \n\nOur **Global PvP Balance** work continues in Red Horizon with another round of improvements. \n\nThe goal remains to make PvP fights less about taking someone down instantly and give you more time to react and fight back. We also want more Talents, Weapons, Skills, and Set Bonuses to feel worth using, rather than having the same few choices \n\nSkills have received adjustments to both their base values and how they scale across Skill Tiers. These changes apply to Conflict and all PvP Dark Zone variants. \n\nGear Set and Brand Set bonuses have also been adjusted separately for PvP where needed. New Talents have been balanced for PvP as well, together with adjustments to some existing outliers. \n\nYou can find the full list of **Skill changes [HERE](https://ubi.li/DpMjQ)**, and the full breakdown of **Gear Set, Brand Set, and Talent changes [HERE](https://ubi.li/AHl3B)**. \n\n# QOL AND UPDATES {#5}\n\n## PVP STAT DISPLAY \n- PvP weapon damage values will now be displayed directly in your Inventory alongside their PvE values. Your stats will also automatically switch to their corresponding PvP values when entering a PvP environment. \n- You can now test PvP Normalization stats and Global PvP Balance overrides directly in the Shooting Range by enabling the PvP settings before heading into Conflict or the Dark Zone. \n- The Inventory Normalization button will be temporarily unavailable while we make updates to the UI. \n\n## BLUEPRINTS AND LOOT \n- **True Patriot** and **Ongoing Directive** materials and blueprints have been added to the General Loot Pool. \n- The following blueprints have also been added to the General Loot Pool: \n  - Unit Alloys \n  - Royal Works \n  - Edelweiss \n  - Concentrated Company \n  - Core Strength \n  - Ortiz: Reficere \n- The following blueprints are now available from Inaya*: \n  - Agitator \n  - Investor \n  - Caduceus \n  - Nurse's Kneepads \n  - Whiplash \n  - Underboss \n  - Caduceus and Nurse’s Kneepads have also been added to Targeted Loot.  \n\n*You need to own the respective item for its blueprint to appear at Inaya.\n\n## FIXES \n### Gear, Weapons, Talents \n- Fixed an issue with the Tinkerer Mask's \"Abridged\" Talent working across different weapon types. [[TCTD2-1405](https://www.ubisoft.com/en-us/game/the-division/the-division-2/bug-reporter/issues/TCTD2-1405)]\n- Fixed an issue with the Tech Plate and Nanite Carrier dropping or spawning as Prototypes with incorrect Talents. \n- Fixed an issue with the Whiplash Exotic Pistol and Underboss Exotic SMG missing their Reconfigure Blueprints. [[TCTD2-4729](https://www.ubisoft.com/en-us/game/the-division/the-division-2/bug-reporter/issues/TCTD2-4729)][[TCTD2-6102](https://www.ubisoft.com/en-us/game/the-division/the-division-2/bug-reporter/issues/TCTD2-6102)]\n- Fixed an issue with Prima Donna stacks transferring to the Gear Shift Named LMG. [[TCTD2-6056](https://www.ubisoft.com/en-us/game/the-division/the-division-2/bug-reporter/issues/TCTD2-6056)]\n\n### Broken Rain Incursion \n- Fixed an issue where one of the Beaver collectibles could appear floating in the air. The Beaver has been moved to a nearby location. \n- Fixed an issue with the mission objective not updating after defeating the Chainsaw boss in Broken Rain while wearing the Dilemma Gear Set and Turmoil Kneepads. \n\n### UI \nFixed an issue with menus becoming inaccessible after being forced out of the Deconstruct Confirmation pop-up. \nFixed an issue on PlayStation with confirming a Commendation also equipping its Arm Patch due to both actions being bound to the X button. [[TCTD2-54](https://www.ubisoft.com/en-us/game/the-division/the-division-2/bug-reporter/issues/TCTD2-54)]\nFixed an issue with the Skins and Dyes submenu in the Apparel section not allowing manual scrolling by dragging the scroll bar with the mouse. \nFixed an issue with the Mega Map displaying an incorrect timer for free Classified Assignments. [[TCTD2-6076](https://www.ubisoft.com/en-us/game/the-division/the-division-2/bug-reporter/issues/TCTD2-6076)]\n\n### Missions and World \n- Fixed an issue with fire and its effects remaining active longer than the corresponding visual animation. [[TCTD2-166](https://www.ubisoft.com/en-us/game/the-division/the-division-2/bug-reporter/issues/TCTD2-166)] \n- Fixed an issue with Mari Singh being missing from East Mall. \n- Fixed an issue with players being able to clip through an environmental door at the Toxic Alley Control Point. [[TCTD2-1585](https://www.ubisoft.com/en-us/game/the-division/the-division-2/bug-reporter/issues/TCTD2-1585)] \n\n### Other \n- Fixed an issue with Into the Dark Season bundles purchased on Steam appearing as not owned in the in-game Store. [[TCTD2-4499](https://www.ubisoft.com/en-us/game/the-division/the-division-2/bug-reporter/issues/TCTD2-4499)] \n- Fixed an issue that could cause players on Steam Deck to be kicked by EAC. Easy Anti-Cheat should now work correctly on Steam Deck. \n- Fixed an issue with Kitsune Event Caches preventing players from opening Gear Caches. \n\n# CLASSIFIED ASSIGNMENTS {#6}\n\n![[TD2] News - The Division 2: Red Horizon - 7. The District Mall Inferno](//staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/7GmEuouLGnVVLJOmdrtN8Z/78f8947ed4f24597eaf8b6de879d4d40/7._The_District_Mall_Inferno.jpg)\n\nTwo new Classified Assignments will be available during Red Horizon: **The District Mall Inferno** on August 27 and **The Georgetown Dead Zone** on October 15. \n\nThe first sends you to the District Mall after Agent Felix McNally is attacked while trying to recover broad-spectrum antivirals, with the Cleaners closing in and an unknown assailant linked to a SHD anomaly still unaccounted for. The second takes you into an area of Georgetown completely uncovered by the SHD network, where a JTF engineer team sent to install new tech has gone missing. \n\nClassified Assignments can be accessed through the dedicated Assignments tab on the map once they become available. Access unlocks at Level 30, and Assignments can be purchased and launched from there.\n\n# SEASON PASS {#7}\n\n![[TD2] News - The Division 2: Red Horizon - 8. Red Horizon Season Pass](//staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/htonqm5ssSKSHOFt1Hs0N/0ac6fb5493e20029c9ed667c67d557c8/8._Red_Horizon_Season_Pass.jpg)\n\nThe optional Season Pass is available to all The Division® 2 players starting at Level 1 for 1000 Premium Credits ($9.99 or your regional equivalent) in the in-game Store. While the Season Pass is accessible from Level 1, some of the rewards will be usable only when you reach Level 40. \n\nPlayers with the Season Pass can unlock premium track rewards such as: \n- 2 Prestige Arm Patches \n- Red Horizon Seeker Mine Skill VFX \n- Richardson Outfit \n- Kernwell Outfit \n- 1 Extra Copy of the Fafnir Exotic Weapon \n- Hot-Rigged Exotic Weapon Skin \n- 10 Gear Dyes \n- 10 Universal Weapon Skins \n- 3 Exotic Caches \n- 9 Optimization Material Caches \n- 9 Crafting Material Caches \n- 400 Premium Credits \n\nThe free track also includes rewards such as: \n- 3 Arm Patches \n- Red Horizon Drone Skill VFX \n- Beaufort Outfit \n- Iron Will Exotic Chest \n- Fafnir Exotic Weapon \n- Drag On Universal Weapon Skin \n- 2 Named Weapons \n- 4 Named Gear Items \n- 2 Exotic Caches \n- 18 Red Horizon Caches \n- 3 Named Item Caches \n\n# RED HORIZON BUNDLE AND SUPPLY DROP {#8}\n\n![[TD2] News - The Division 2: Red Horizon- EDIT - 9. RedHorizon SeasonPass upd](//staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/6BUs3ULGoEVspETqJ4QhiR/ea174bc08ed71bb38ddb816c0f374b95/9._RedHorizon_SeasonPass_upd.jpg)\n\nThe Red Horizon Bundle, available for $29.99 or your regional equivalent, includes: \n- The Premium Season Pass, with 100 Tiers of rewards to unlock. \n- Two Classified Assignment missions, with one available at launch and the second coming later in the season. \n- +15% Season Pass XP boost. \n- An exclusive Cleaners-themed outfit. \n- 20 Tier Skips. \n\n**The Red Horizon Supply Drop**, available for $49.99 or your regional equivalent, includes everything listed above, plus 5000 Premium Credits. \n\n**If you already own some of the included content:** \n- If you already own the Premium Season Pass, purchasing either offer will grant you 1000 Premium Credits back in-game. \n- If you already own the Red Horizon Bundle and purchase the Supply Drop, you will receive 3000 Premium Credits, on top of the 5000 already included. \n- If you already own the Red Horizon Supply Drop, you will receive 3000 Premium Credits instead of the Red Horizon Bundle. \n- If you do not receive an in-game notification for the offer, check the Special Deliveries tab in your inventory. \n\n# ONE TIME OFFER {#9}\n\n![[TD2] News - The Division 2: Red Horizon - 10. Red Horizon OneTimeOffer](//staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/7LrZ8RLi1WVqtaFdByRsLC/8964d59eec1c4e4e3d0d086fe06bb16c/10._Red_Horizon_OneTimeOffer.jpg)\n\nDon’t miss out on this exclusive One Time Offer, available for $19.99 or your regional equivalent. It includes 2000 Premium Credits and 600 bonus Credits, plus the Classic Mask, because some looks are classics for a reason. \n\n <hr/>\n\nHalloween is not too far away, and we’ll have more to share soon about what we’ve prepared for the occasion. \n\nAs always, if you run into any issues while playing, please report them through the [Bug Reporter](https://ubi.li/TD2-BugReporter) so the team can investigate. \n\nGood luck out there, Agents. \n\n**/ The Division 2 Team**","abstract":"Red Horizon puts the Cleaners front and center and turns up the pressure across Washington, D.C. See what we have been working on and what awaits you this season. ","thumbnail":{"description":"","url":"https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/gokFSNmhSifeOfyi9znvR/b3eb6a8c437c17f0f0b997ea1df31a65/-TD2-_News_-_The_Division_2_Red_Horizon-Red_Horizon_Keyart.jpg"},"type":"news","readTime":20,"authors":null,"tag":"BR-the-division GA-the-division-2","priority":2},"feed":{"items":[{"thumbnail":{"url":"https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/513QsYLTZSMeeGM9tfPzmY/6efcdc37a37799519bcbdf432c3faa24/TD2_EchoesofCentralPark_Keyart.jpg","description":""},"content":"[The Division 2: Echoes of Central Park](https://www.ubisoft.com/en-us/game/the-division/the-division-2) is out now, inviting you to take on a dark threat that lurks in Central Park. For the first time in franchise history, you can explore New York City's Upper West Side and the iconic Central Park as you investigate a mysterious and sinister threat in the area. With fear and rumors running rampant in the Upper West Side, you'll need to earn the trust of three reluctant heroes to rescue your target and defeat what lurks within. \n\n<https://youtu.be/Y2o8OGfwEpQ>\n\n### A New Tone and Storytelling \n\nTaking inspiration from the horror genre, fear is the heart of Echoes of Central Park. Citizens in the Upper West Side are gripped by paranoia of an unknown sinister threat, and are terrified as enemy faction members, friends, and family turn up dead or missing in gruesome ways. On top of everything, there are rumors of a new virus variant spreading. And all of it is centered around what lurks in the shadows in Central Park.  \n\nThe story is, in essence, exploring the idea of a society in which fear feeds on itself until rumors become truth, and in a new storytelling approach, it's presented in the style of a flashback as a narrator guides you through her version of events. It's up to you to see through the fog of fear and rumor to find reality and eliminate the threat within Central Park.  \n\nYou can play Echoes of Central Park in solo or co-op mode. If you're below level 40, you'll get a boost, allowing you to immediately start the eerie adventure while being appropriately leveled to take on the challenges. \n\n### Explore the Upper West Side and Central Park \n\n![TD2_EoCP_NaturalHistoryMuseum](//staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/7ttO9vbPxriSHHuwI4Q1b4/1a8841e71d91eeb3dc7d6d41045476c6/TD2_EoCP_NaturalHistoryMuseum.jpg)\n\nIn the biggest experience in The Division 2 since Warlords of New York, and featuring a much larger map than Battle for Brooklyn, Echoes of Central Park starts in the Upper West Side. In the iconic neighborhood, you'll explore and complete missions in famous landmarks like the Natural History Museum in the area from Lincoln Square to the Dakota District.  \n\nEventually, your adventure will take you into the park itself, which has transformed from the symbol of the city to a place of decay and mystery. The park was originally used as a mass burial ground during the initial outbreak, but as the last known presence in the park has disappeared, fear haunts the area as a new apex threat took up residence. Set in the summer after the Warlords of New York expansion, you'll need to confront this formidable new force and take on familiar foes to find out what really happened in Central Park.  \n\n### Play With New Companions \n\n![TD2_EoCP_Companions](//staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/5UgQ5cjbCAHoT1yFms3aLJ/9848e30ad132faab2b44b0674dba4e43/TD2_EoCP_Companions.jpg)\n\nTo face the horrifying threat in Central Park, you'll need some help. Echoes of Central Park introduces three Companions, each of whom has a unique past and fighting style, as well as some knowledge of what's happening inside the park. By uncovering their backstories, you‘ll be able to earn their trust and have them fight alongside you as you prepare to enter the park. You can have one companion in your party at a time, and they will provide powerful support in combat to make your path to victory a bit smoother. They are:  \n\n- Brayleigh Callahan - A Sniper who is an MIT graduate and Olympian medalist in shooting \n- Elwood Franklin – A Protector who was a former mall cop, but aspires to become an NYPD officer \n- Morse Feeney – An Assault who is a rugged veteran and former first wave Division agent with a mysterious past \n\nWhen replaying missions, assign a new companion to fight with you for a fresh experience. Each character responds to situations differently, offering different perspectives with their dialogue and a new tactical approach to combat. Outfits inspired by the new companions, as well as a skin for the new exotic weapon, are included with the Echoes of Central Park Deluxe Edition. \n\n### Why You Should Replay Echoes of Central Park \n\nIn your first playthrough of Echoes of Central Park, it will be a struggle just to survive. In the park, you'll be hunted pretty with no GPS assistance, constantly facing down never-ending waves of enemies. As you progress through the story, you'll learn more about the truth behind the enemy you're facing, and will collect new gear to help you face them. Each time you enter the park, you'll be more prepared to take on the challenge, and eventually you'll become the predator, giving you more control about how to take on your enemies. \n\n![TD2_EoCP_CentralParkCombat](//staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/4ivHPmHMGzVbseCgTUfu5v/4ba83abe7f786dd0c62537946ae4ff2a/TD2_EoCP_CentralParkCombat.jpg)\n\nThe outcome of each enemy encounter you have will affect what happens after the battle is over. Do well, and you'll get exclusive rewards that will help you; but if you perform poorly, you'll get a disadvantage moving forward. Combine these game-changing impacts with companions who give different battle buffs, and it's clear no two runs are ever quite the same in Echoes of Central Park's endgame experience. \n\n### New Skills and Gear \n\nAs you defeat the eerie enemies within Central Park, you can earn six new skill variants inspired by the horrors you'll face, including:  \n\n- Corrosive Trap \n- The Gas Bomber \n\nYou can also earn new gear, including:  \n\n- The Ratel (new Exotic Weapon) \n- A new Gear Set \n\nAt launch, Prototype Gear will be normalized within Echoes of Central Park to preserve the intended challenge, tension, and sense of danger as you explore. The Division 2 developers plan to enable Prototype Gear's full strength within the DLC at a later date, bringing it in line with how it functions in the rest of the game. \n\nPlay [The Division 2: Echoes of Central Park](https://store.ubisoft.com/6a67fbf5262bc75df33a9622.html) today on PS5, Xbox Series X|S, and PC via the Ubisoft Store, Steam, and the Epic Games Store. You can also play with a [Ubisoft+ subscription](https://store.ubisoft.com/us/ubisoftplus?lang=en_US).  ","abstract":"In the biggest expansion since Warlords of New York, explore Central Park for the first time in franchise history in a haunting story for fear and rumors.","button":{"trackingValue":"4yCTNp7RZ1Fdm1kMKYgndg : [TD2] DLC 3 launch aticle - localized","buttonUrl":"/4yCTNp7RZ1Fdm1kMKYgndg/the-division-2-echoes-of-central-park-dlc-is-available-now","trackingCategoryValue":"news","commonTranslationId":"readMore","buttonType":"internal"},"date":"Tue Nov 03 2026 15:00:00 GMT+0000 (Coordinated Universal Time)","trackingPageValue":"[TD2] DLC 3 launch aticle - localized","title":"The Division 2: Echoes of Central Park DLC is available now!","id":"4yCTNp7RZ1Fdm1kMKYgndg","placement":null,"type":"news","categories":["the-division-2"],"readTime":6,"authors":null,"tag":"BR-the-division GA-the-division-2"},{"content":"Tune in from November 3 - November 10 to earn exclusive rewards while watching your favorite [The Division 2 streamers on Twitch](https://www.twitch.tv/directory/category/tom-clancys-the-division-2).\n\n# HOW TO EARN YOUR REWARDS\n\nGetting your hands on these drops is simple, but make sure your accounts are set up correctly so your rewards go to the right platform:\n\nLog into your Twitch account and make sure it's linked to your Ubisoft Connect account.\n\nCheck that your preferred gaming platforms (PC, PlayStation, Xbox, etc.) are linked in your Ubisoft Connect account.\n\nWatch any drop-enabled The Division 2 stream from our partnered content creators.\n\nYour watch time stacks across multiple channels, so you can switch between streams and still make progress.\n\nWhen a drop becomes available, claim it directly on Twitch.\n\nAfter claiming your reward, log into The Division 2 on your preferred platform to ensure your item is correctly delivered there.\n\nYou can also visit Ubisoft Drops website for step-by-step instructions.\n\n# TWITCH DROPS SCHEDULE AND REWARDS\n\nRewards are unlocked based on your total watch time:\n\n- Watch for 30 minutes to earn the Central Park Arm Patch.\n- Watch for 1 hour to unlock a Named Cache.\n\n- Watch for 2 hours to earn the Bird Skull Backpack Trophy.\n- Watch for 3 hours to unlock an Exotic Cache.\n\n- Watch for 4 hours to earn an Outfit Token.\n\nInterested in joining the Ubisoft Content Creator Program? [Sign up here](https://creatorsprogram.ubisoft.com/) and become part of our creator community!\n\n/The Division 2 Team\n","abstract":"Tune in from November 3 – November 10 to earn exclusive rewards while watching your favorite The Division 2 streamers on Twitch.","button":{"trackingValue":"5EEgwKS6kDqyvUFo5PJYsB : [TD2] EOCP - Twitch Drops Article","buttonUrl":"/5EEgwKS6kDqyvUFo5PJYsB/the-division-2-echoes-of-central-park-launch-twitch-drops","trackingCategoryValue":"news","commonTranslationId":"readMore","buttonType":"internal"},"date":"Tue Nov 03 2026 15:00:00 GMT+0000 (Coordinated Universal Time)","trackingPageValue":"[TD2] EOCP - Twitch Drops Article","title":"The Division 2: Echoes of Central Park Launch Twitch Drops","id":"5EEgwKS6kDqyvUFo5PJYsB","categories":["the-division","the-division-2"],"placement":null,"thumbnail":{"description":"","url":"https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/6V7rmDUJ0hG0cFGEVXYDMQ/aef1675d95ca446732cd0cd8f223ffe1/TCTD2_Y8S3TCTD2_Twitch_Drop_DLC3_Echoes_of_CP_Final_960x540.jpg"},"type":"news","readTime":2,"authors":null,"tag":"BR-the-division GA-the-division-2"},{"content":"Echoes of Central Park is almost here! We'll share a full breakdown of the DLC when it launches on November 3, followed by more details on the Event Pass celebrating its arrival.\n\nIn the meantime, these patch notes cover everything else coming with Y8S3.3, including Conflict improvements, the Crossplay rollout, Master Climax Mission and more. Let's get into it.\n\n# CONTENTS\n\n- [Crossplay](#1)\n- [Friend Referral](#2)\n- [Shepherd Event](#3)\n- [Master Climax Mission](#4)\n- [Improvements and Fixes](#5)\n\n# CROSSPLAY {#1}\n\n![[TD2] News - [TUY8S3.3] Crossplay Rollout, Conflict Improvements & More - 1. Crossplay](//staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/5Igjb0Pln8qsnpEgyFfw6B/9392a3ecd2b975ceba06fc9b884931b0/1._Crossplay.jpg)\n\nCrossplay is arriving in stages, with PC, PlayStation, and Xbox players able to play together from November 17. Here's what to expect:\n\n- __November 3:__ You'll start seeing some Crossplay icons and other interface changes in game, but you won't be able to play across platforms yet.\n- __November 10:__ If you're on PC, you'll move to the new Crossplay servers. PC Leaderboards will reset as part of this move. You won't be able to play across platforms just yet.\n\n- __November 17:__ If you're on PlayStation or Xbox, you'll join the new servers. Crossplay will go live across all three platforms, and its options will become available in game.\n\nLeaderboards will be __temporarily hidden__ on all platforms until November 17, when Crossplay goes live. It will then be __enabled by default__, but you can turn it off from the character selection screen.\n\n## CLANS\n\nWe're increasing the Clan member limit from __50 to 100__, giving you more room to grow your Clan.\n\nYour Clan will move automatically when its first member joins the new Crossplay servers.\n\n### YOUR PLACE IN THE CLAN\n\nWhen your Clan moves, places will be reserved for its original members who haven't joined the new servers yet. The current plan is for these reservations to last __three months from when they're created__. For example, if you're the first member of your Clan to log in on PC on November 10, the three-month reservation period for your Clanmates starts that day.\n\nAn active reservation guarantees your place. If it expires or is removed, you can still rejoin if there's room. Returning members keep their original ranks, with an exception for Clan Leaders whose reservations have expired.\n\nClan Leaders and Lieutenants with the necessary permissions can remove reservations.\n\n### CLAN LEADERSHIP\n\n- If your Clan Leader joins first, they'll stay in charge.\n- If another member joins first, they'll become the temporary Clan Leader. The original Clan Leader will regain leadership when they join, provided their reservation is still active.\n\n- If the original Clan Leader's reservation expires, the temporary leader becomes the full Clan Leader. The original leader can still rejoin if there's room, but won't regain leadership when they return.\n\nTemporary Clan Leaders have Lieutenant-level permissions. They cannot rename the Clan or demote, kick, or remove reservations for the original Clan Leader or Lieutenants. They must also pass leadership to another member before leaving the Clan.\n\n### CLAN NAMES\n\nIf your Clan name is already taken, a number identifying its original platform will automatically be added to the end:\n\n- PC - #2\n- Xbox #3\n\n- PlayStation - #4\n\nFor example, a PC Clan called ClanAwesome would become ClanAwesome #2.\n\n### OTHER CLAN DATA\n\nThe following won't carry over:\n- Clan messages\n\n- Invites and join requests\n- Clan caches\n\nYour Clan's Bio will carry over if the member who wrote it is the first to bring the Clan to the new servers.\n\n# FRIEND REFERRAL {#2}\n\n![[TD2] News - [TUY8S3.3] Crossplay Rollout, Conflict Improvements & More - 2. Friend Referral](//staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/O6kJgaB3cs5ccdrx01H4I/287d8b81501356157c5d2ea02a828f27/2._Friend_Referral.jpg)\n\nThe Friend Referral Program is getting updated outfit rewards for you and your friends!\n\nVisit the [Friend Referral website](https://referral.ubisoft.com/the-division-2-referral/), log in with your Ubisoft account, and get your unique referral link to share with friends.\n\nEach invited friend needs to play for at least __2 hours__ for their referral to count:\n\n- You'll earn the __Cyclops Outfit__ for your first successful referral.\n- You'll earn the __Esprit de Corps Outfit__ for your second successful referral.\n\n- Your invited friends will earn the __Frenzied Outfit.__\n\n# SHEPHERD EVENT PROJECT {#3}\n\nFrom November 17 to November 26, answer Calls for Backup and help fellow Agents to earn rewards through a six-project chain.\n\nEach project asks you to gain one Shepherd Rank. The full chain is available from day one, so you can work through it at your own pace before the event ends.\n\nThe increase from 1 to 3 automatic endorsements introduced during the previous Shepherd Event remains in place, helping you climb the ranks.\n\nAs you complete the chain, you'll earn:\n\n- Every project: 10 Exotic Components and 700,000 XP.\n- Projects 1 to 5: One Reconstructed Cache per project.\n\n- The final project: __Malinois__, a Named Mk16.\n\n# MASTER CLIMAX MISSION {#4}\n\nThe Master Climax Mission becomes available on November 3. Your first completion on Master difficulty guarantees the Loaded for Bear Exotic Gloves as a special reward. The gloves can also drop from the Climax Mission at any difficulty, with higher difficulties offering better drop chances.\n\n|  |  |\n|:---|:---|\n| **Loaded for Bear**<br>Exotic Gloves | **Talent Afterburn**<br><br>Hitting enemies applies stacks to them. An enemy cannot have more than 20 stacks applied to them.<br><br>When reloading your weapon, all stacks will be consumed to deal 100% Weapon Damage per stack to the enemy they are applied on.|\n\n![[TD2] News - [TUY8S3.3] Crossplay Rollout, Conflict Improvements & More - 3.Loaded for Bear Exotic Gloves](//staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/6Qd1gqQFVyCjiYipeuucNM/c148080c692a2758056c39397fe00375/3.Loaded_for_Bear_Exotic_Gloves.jpg)\n\n# IMPROVEMENTS AND FIXES {#5}\n\n## CONFLICT\n\nConflict's scoreboard is getting an update to better show how you contribute to your team. Alongside kills and assists, new __Defend, Snipe, Support, and Disrupt__ stats will track your defensive performance, Rifle and Marksman Rifle eliminations, support actions, and disruption.\n\nIn Domination, the scoreboard will show __Captures instead of Deaths column__. Match notifications will also show your match score gains.\n\n## NEW COMBAT MARKS\n\nFour new Combat Marks recognize different ways you can help your team:\n\n- __Iron Wall:__ Mitigate heavy incoming damage and survive.\n- __Extended Reach:__ Secure eliminations with Rifles or Marksman Rifles.\n\n- __Tactical Aid:__ Heal or revive teammates, Pulse enemies, or provide helpful Skill and Talent effects.\n- __System Breaker:__ Destroy enemy Skills, apply Status Effects, or secure eliminations through Skills, explosions, or Status Effects.\n\nThese new Marks award __match score, not XP__.\n\n### HONOR MARKS\n\nAt the end of each match, Honor Marks will recognize standout contributions, including objectives, eliminations, defense, support, disruption, and accuracy. You can earn __one Honor Mark per match__.\n\n- __MVP:__ Awarded to the eligible Agent with the highest match score on the winning team. Grants __200 XP and 15 additional Conflict Commendation Currency (CCC)__.\n- __Other Honor Marks:__ Awarded based on the relevant match stats, with __150 XP and 8 additional CCC__ for each award.\n\nAlongside these Conflict updates, we're making another round of PvP balance adjustments to weapons and Talents. If stat tables are your idea of light reading, you can find all the balance changes, Conflict scoreboard details, and how to earn Honor Marks in our [full PvP updates breakdown.](https://ubi.li/Vn340)\n\n## STRETCH GOALS\n\nWe're giving Stretch Goals a break this season so we can take a fresh look at them. The plan is to bring them back next season with something better for you to work towards.\n\n## FIXES\n\n- Fixed the issue with reduced accuracy when firing the Steel & Sons ACR Exotic Rifle from cover. [[TCTD2-7224](https://www.ubisoft.com/en-us/game/the-division/the-division-2/bug-reporter/issues/TCTD2-7224)]\n- Fixed the issue with a broken transition when accessing the Red Horizon Season Pass.\n\n- Fixed the issue with Classified Assignments showing already unlocked Collectibles as available rewards for other Agents. [[TCTD2-148](https://www.ubisoft.com/en-us/game/the-division/the-division-2/bug-reporter/issues/TCTD2-148)]\n- Fixed the issue with the missing Reconfiguration Blueprint for the Harrier Pride Exotic Backpack. [[TCTD2-7366](https://www.ubisoft.com/en-us/game/the-division/the-division-2/bug-reporter/issues/TCTD2-7366)]\n\n- Fixed the issue with the Conflict Results screen displaying 30 CCC instead of 45 CCC as the level-up reward after Level 20.\n- Fixed the issue with the Protected Reload Talent not granting bonus armor to other subgroups.\n\n## KNOWN ISSUES\n\n- After completing all Manhunt Scouts marked as High-Value Targets, the Climax Mission remains locked in the Scouts menu and does not appear on the map. \n    - Workaround: Log out and back in to unlock it. \n\nIf you encounter any issues you'd like to report, please use our Bug Reporter.\n\n---\n\nStay sharp out there, Agents.\n\n__/ The Division 2 Team__","abstract":"See what’s coming in Y8S3.3, including the Crossplay rollout, Conflict improvements, updated Friend Referral rewards, and the Shepherd Event. ","button":{"trackingValue":"7L8TlD1Hv0XC1prOD8mdte : [TD2] News - Title Update Y8S3.3","buttonUrl":"/7L8TlD1Hv0XC1prOD8mdte/tuy8s33-crossplay-rollout-conflict-improvements-more","trackingCategoryValue":"news","commonTranslationId":"readMore","buttonType":"internal"},"date":"Mon Nov 02 2026 15:45:00 GMT+0000 (Coordinated Universal Time)","trackingPageValue":"[TD2] News - Title Update Y8S3.3","title":"[TUY8S3.3] Crossplay Rollout, Conflict Improvements & More","id":"7L8TlD1Hv0XC1prOD8mdte","categories":["the-division","the-division-2"],"placement":null,"thumbnail":{"description":"","url":"https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/6DVtaPhnGzFQzWfSWkS5IS/98ed230091e7e0d2bacbca7f768261d2/TU_Y8S3.3.jpg"},"type":"news","readTime":8,"authors":null,"tag":"BR-the-division GA-the-division-2"},{"button":{"trackingValue":"Ni81_1CWPyI : the-division-2-new-horror-twist-endgame-and-skill-variants","buttonType":"youtube-modal","commonTranslationId":"watchNow","buttonUrl":"Ni81_1CWPyI?cc_lang_pref=en&cc_load_policy=1&hl=en","trackingCategoryValue":"videos"},"thumbnail":{"description":"The Division 2: New Horror Twist, Endgame, and Skill Variants","url":"https://i.ytimg.com/vi/Ni81_1CWPyI/maxresdefault.jpg"},"date":"2026-11-02T13:48:39.000Z","categories":["the-division-2"],"type":"videos","description":"Echoes of Central Park launches November 3. Pre-order now to receive the NY Purifier Mask at launch.\n\nGo behind the scenes of The Division 2: Echoes of Central Park with developers from Massive Entertainment, Ubisoft Bucharest, and Ubisoft Reflections.\n\nDiscover the inspirations behind The Division 2’s darkest story yet, from the mysteries hidden within Central Park to the DLC’s haunting atmosphere, new companions, skill variants, and replayable endgame experience. Featuring the largest playable area since Warlords of New York, Echoes of Central Park takes The Division 2 into its most unsettling territory yet.\n\nAbout The Division 2:\nTom Clancy's The Division 2 is a shooter RPG with a thrilling campaign fully playable in co-op and multiple PVP modes.\n\nIn The Division 2, save your country in Washington, DC. In the Warlords of New York expansion, hunt down Aaron Keener, a former Agent who has taken control of New York. In Battle for Brooklyn, defend the borough as the Cleaners cross the river. And in Echoes of Central Park, answer a distress signal from deep within the park and face a new threat.\n\n#Ubisoft #TheDivision2\n\nLearn more about Ubisoft: www.ubisoftgroup.com\n\n© Ubisoft Entertainment. All Rights Reserved. Ubisoft and the Ubisoft logo are registered trademarks in the US and/or other countries.","tag":"BR-the-division GA-the-division-2","id":"Ni81_1CWPyI","title":"The Division 2: New Horror Twist, Endgame, and Skill Variants","trackingPageValue":"the-division-2-new-horror-twist-endgame-and-skill-variants","content":"[video](https://www.youtube-nocookie.com/embed/Ni81_1CWPyI?cc_lang_pref=en&cc_load_policy=1&hl=en)"},{"button":{"trackingValue":"Y2o8OGfwEpQ : the-division-2-echoes-of-central-park-launch-trailer","buttonType":"youtube-modal","commonTranslationId":"watchNow","buttonUrl":"Y2o8OGfwEpQ?cc_lang_pref=en&cc_load_policy=1&hl=en","trackingCategoryValue":"videos"},"thumbnail":{"description":"The Division 2: Echoes of Central Park - Launch Trailer","url":"https://i.ytimg.com/vi/Y2o8OGfwEpQ/maxresdefault.jpg"},"date":"2026-10-30T18:16:35.000Z","categories":["the-division-2"],"type":"videos","description":"Echoes of Central Park is out now: the biggest experience since Warlords of New York. Get it here: https://store.ubisoft.com/6a67fbf5262bc75df33a9622.html\n\nTom Clancy's The Division® 2: Echoes of Central Park invites agents to explore New York's iconic landmark for the first time in the franchise's history.\n\nAbout The Division 2:\nTom Clancy's The Division 2 is a shooter RPG with a thrilling campaign fully playable in co-op and multiple PVP modes.\n\nIn The Division 2, save your country in Washington, DC. In the Warlords of New York expansion, hunt down Aaron Keener, a former Agent who has taken control of New York. In Battle for Brooklyn, defend the borough as the Cleaners cross the river. And in Echoes of Central Park, answer a distress signal from deep within the park and face a new threat.\n\n#Ubisoft #TheDivision2\n\nLearn more about Ubisoft: www.ubisoftgroup.com\n\n© Ubisoft Entertainment. All Rights Reserved. Ubisoft and the Ubisoft logo are registered trademarks in the US and/or other countries.\"","tag":"BR-the-division GA-the-division-2","id":"Y2o8OGfwEpQ","title":"The Division 2: Echoes of Central Park - Launch Trailer","trackingPageValue":"the-division-2-echoes-of-central-park-launch-trailer","content":"[video](https://www.youtube-nocookie.com/embed/Y2o8OGfwEpQ?cc_lang_pref=en&cc_load_policy=1&hl=en)"},{"abstract":"Tune in from October 15 – October 22 to earn exclusive rewards while watching your favorite The Division 2 streamers on Twitch.","button":{"trackingValue":"VLVLB9xFr5sLxAtZSVM6J : [TD2] article Twitch Drops Red Moon Unleashed","buttonUrl":"/VLVLB9xFr5sLxAtZSVM6J/the-division-2-red-moon-unleashed-event-twitch-drops","trackingCategoryValue":"news","buttonType":"internal","commonTranslationId":"readMore"},"date":"Thu Oct 15 2026 16:00:00 GMT+0000 (Coordinated Universal Time)","title":"The Division 2: Red Moon Unleashed Event Twitch Drops","id":"VLVLB9xFr5sLxAtZSVM6J","trackingPageValue":"[TD2] article Twitch Drops Red Moon Unleashed","categories":["game-updates","the-division","the-division-2"],"content":"Tune in from October 15 - October 22 to earn exclusive rewards while watching your favorite [The Division 2 streamers on Twitch](https://www.twitch.tv/directory/category/tom-clancys-the-division-2).\n\n# HOW TO EARN YOUR REWARDS\n\nGetting your hands on these drops is simple, but make sure your accounts are setup correctly so your rewards go to the right platform:\n\nLog into your Twitch account and make sure it's linked to your Ubisoft Connect account.\n\nCheck that your preferred gaming platforms (PC, PlayStation, Xbox, etc.) are linked in your Ubisoft Connect account.\n\nWatch any drop-enabled The Division 2 stream from our partnered content creators.\n\nYour watch time stacks across multiple channels, so you can switch between streams and still make progress.\n\nWhen a drop becomes available, claim it directly on Twitch.\n\nAfter claiming your reward, log into The Division 2 on your preferred platform to ensure your item is correctly delivered there.\n\nYou can also visit Ubisoft Drops website for step-by-step instructions.\n\n# TWITCH DROPS SCHEDULE AND REWARDS\n\nUnlock 5 rewards inspired by the Red Moon Unleashed event, based on your total watch time:\n\n- Watch for 30 minutes to earn the Summon Arm Patch.\n- Watch for 1 hour to unlock a Named Cache.\n- Watch for 2 hours to earn the Bind Arm Patch.\n- Watch for 3 hours to unlock an Exotic Cache.\n- Watch for 4 hours to earn the Eye Contact Weapon Skin.\n\nInterested in joining the Ubisoft Content Creator Program? [Sign up here](https://creatorsprogram.ubisoft.com/) and become part of our creator community!\n\n/The Division 2 Team","placement":null,"thumbnail":{"description":"","url":"https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/4SPW8RkJSxN6cPRcTuwfyU/1ca6f02887448e5c0aa08f9e6a6bd049/TCTD2_Halloween_Event_Twitch_Drop_Finals_960x540.jpg"},"type":"news","readTime":2,"authors":null,"tag":"BR-the-division GA-the-division-2"},{"content":"The Echoes of Central Park Showcase pulled back the curtain on the next chapter of The Division 2, giving Agents an in-depth look at the upcoming DLC, its story, gameplay features, and what lies ahead for the franchise. From a mysterious threat spreading fear across Manhattan to new gameplay details, crossplay, and the Survivors Test Program, here's everything you need to know. \n\nhttps://www.youtube.com/watch?v=QATKcnZ4YHQ\n\n### Venture Beyond the Wall in Echoes of Central Park\nThe showcase opened with a new story trailer and a first in-depth look at gameplay for The Division 2: Echoes of Central Park, launching on November 3.\n<br>\nDescribed as the darkest and most disturbing DLC in The Division 2 yet, Echoes of Central Park takes players into a new horror territory, where paranoia, unsettling disappearances, and rumors of a sinister new threat blur the line between myth and reality.\n<br>\nSet in the Upper West Side and Central Park, the DLC explores a previously unseen area of Manhattan that has remained sealed off since the outbreak. The map, which is roughly twice the size of Battle for Brooklyn, gives players an expansive new playable area to discover as they investigate, and ultimately face, the threat lurking within Central Park.\n<br>\nAfter a distress call from Miranda Veer, CEO of Veer Corp, Agents are deployed to rescue her, but when an unknown threat halts the mission, they must uncover the truth behind the growing fear surrounding the park before taking up the fight again.\n<br>\nAs harrowing rumors spread throughout the city about the horrors within the park, it will be up to players to separate fact from fiction and discover what's really happening beyond the barricades.\n\nhttps://youtu.be/UVt0Ibkracg\n\n### Explore a New Story Campaign and Gameplay Features\nEchoes of Central Park introduces a new campaign that takes Agents across the Upper West Side, from Lincoln Square to the Dakota district, as they investigate the mystery surrounding Central Park.\nThroughout the campaign, players will work alongside companions, earning their trust and unlocking unique abilities that can support them in combat. Each companion offers distinct abilities that can complement different approaches to combat. Players will also be able to unlock six new skill variants inspired by the horrors they will face in the park and bring them back into the main game. The DLC also introduces a new Exotic Weapon, The Ratel, and a new gear set.\n\nhttps://youtu.be/iho1PG_0KIo\n\n### A New Replayable Endgame Experience\nBeyond the main campaign, Echoes of Central Park introduces a new replayable endgame experience set within Central Park. Players will first explore the park as hunted prey, facing the pressure of enemies flooding the area while an unknown threat stalks them from the shadows. As they uncover the park's mysteries and grow stronger, they'll be able to return and experience the park in a new way, taking the fight to the predators that once hunted them.\n\n### Go Behind the Scenes with the Development Team\nThe showcase also featured a developer deep dive, with exclusive interviews from the studio team members offering a closer look at the vision behind Echoes of Central Park.\n<br>\nDevelopers from Massive Entertainment, Ubisoft Bucharest, and Ubisoft Reflections shared how the team approached creating a darker, more mysterious experience while remaining grounded in the world of The Division. The discussion explored the origins of the DLC's horror-inspired atmosphere, the creation of the Upper West Side and Central Park, and the design philosophy behind its campaign and endgame systems.\n\n### Pre-Order Echoes of Central Park Today\n[Pre-orders for Echoes of Central Park are available now.\n](https://store.ubisoft.com/6a67fbf5262bc75df33a9622.html)\n\nThe DLC includes a Level 40 Boost, allowing players to jump directly into the experience, as well as a stash space expansion. Players who pre-order will also receive the NY Purifier Mask, a Central Park-inspired bonus mask at launch.\n<br>\nIn addition to everything included in the DLC, the Deluxe Edition offers three exclusive outfits inspired by the companions players will meet throughout their journey, plus an Exotic weapon skin.\n\n![-TD2- News - EOCP Showcase Recap - TCTD2 Deluxe-Edition Static 960x540](//staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/2SxFOSgpSyVCP4nQMhn2JX/471a5df3df84dd753d4e5eb6dc126b47/TCTD2_Deluxe-Edition_Static_960x540.jpg)\n\n### Crossplay Is Coming to The Division 2\nThe team also announced that crossplay is coming to The Division 2 following the launch of Echoes of Central Park.\n<br>\nCrossplay will be rolled out gradually throughout November, with implementation and platform migration beginning after the DLC launches. Once fully deployed, Agents across platforms will be able to squad up and tackle missions together throughout The Division 2, with plans for the feature to be fully available by the launch of Season 4.\n\n### Red Moon Rising Is Live Now\nThe showcase also highlighted Red Moon Rising, a new multi-phase event currently underway in The Division 2.\n<br>\nThe event introduces new PvE challenges in Dark Zone areas, including a Marauder world boss, the Red Moon Recruiter, new rewards, and opportunities to earn an Exotic weapon, an Exotic gear piece, and additional loot.\n<br>\nThe Red Moon Rising Event is only the beginning of a much larger threat that looms over Washington, D.C. Agents should stay vigilant as the situation continues to unfold.\n\n![-TD2- News - EOCP Showcase Recap - TCTD2 Red-Moon-Rising-Key-Art 960x540](//staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/rgUTxCd3xLt2lhkuX5ky1/8f25bfdd5f74fa16638bff975e6df7d4/TCTD2_Red-Moon-Rising-Key-Art_960x540.jpg)\n\n### Register for the Survivors Test Program\nThe final announcement of the showcase focused on The Division 2: Survivors, the upcoming high-stakes extraction expansion set in The Division universe.\n\n[Players can now register for the Survivors Test Program](https://thedivision2.com/register) for a chance to participate in upcoming tests and help shape the future of Survivors through feedback on work-in-progress builds.\n\n![-TD2- News - EOCP Showcase Recap - TCTD2 Survivors-Registration-Static 960x540](//staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/7uTdQNOG884IxOGlz0LEZe/f12c52c24144dc3bc46d4b35d2128b9e/TCTD2_Survivors-Registration-Static_960x540.jpg)\n\n### Everything Announced During the Showcase\n- Echoes of Central Park Announce Trailer\n- Echoes of Central Park Gameplay Overview Trailer\n- Developer Deep Dive & Community Post-Show\n- Echoes of Central Park Pre-Orders Available Now\n- Crossplay: Coming Soon\n- Red Moon Rising In-Game Event: Live Now\n- Free Weekend (September 24-28)\n- Save Up to 90% on The Division Franchise (through October 13)\n- Survivors Test Program Registration\n","abstract":"Missed the Echoes of Central Park Showcase? Catch up on all the major announcements, including a closer look at the next DLC for The Division 2, new gameplay details, Crossplay, the Survivors Test Program, and more.","button":{"trackingValue":"2o0p19fLQGze5j7h3iEXTN : [TD2] News - EOCP Showcase Recap","buttonUrl":"/2o0p19fLQGze5j7h3iEXTN/the-division-2-echoes-of-central-park-showcase-everything-you-need-to-know","trackingCategoryValue":"news","commonTranslationId":"readMore","buttonType":"internal"},"date":"Tue Oct 13 2026 16:00:00 GMT+0000 (Coordinated Universal Time)","trackingPageValue":"[TD2] News - EOCP Showcase Recap","title":"The Division 2 Echoes of Central Park Showcase: Everything You Need to Know","id":"2o0p19fLQGze5j7h3iEXTN","categories":["the-division","the-division-2"],"placement":null,"thumbnail":{"description":"","url":"https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/3Ba8lRxw6pJnGne4m3nIZX/4da93a9d88b533d5de99d881f090ad4d/TCTD2_recap_thumbnail_960.jpg"},"type":"news","readTime":6,"authors":null,"tag":"BR-the-division GA-the-division-2"},{"content":"# CONTENTS: \n- [Red Moon Unleashed](#1) \n- [Content Creator Collab](#2) \n- [Stats and Multiplier Events](#4) \n- [Classified Assignment](#5) \n- [Improvements and Fixes](#6) \n\n# RED MOON UNLEASHED {#1}\n\n![-TD2- News - -TUY8S3.2- Red Moon-1. TD2 Red Moon Unleashed 1](//staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/7aB4ak8nytm82tJGBX0cl1/5f44c2ba1ecdcf28ce269f0133f8f8ab/-TD2-_News_-_-TUY8S3.2-_Red_Moon-1._TD2_Red_Moon_Unleashed_1.jpg)\n\nRed Moon Rising was only the beginning. Now, enemies the Division once dismissed as myth are answering the Necromancer’s call, and the Red Moon’s influence is spreading beyond the Dark Zone. \n\nFrom **October 15** to **November 3**, Red Moon Unleashed leaves D.C. caught between dusk and night. Light fog gives way to heavy storms and the deep red glow of a Blood Storm, with something far more sinister waiting in the dark. \n\nAll players who log in during the event will receive the **Bound Slasher Mask** for free. \n\n![-TD2- News - -TUY8S3.2- Red Moon-2. Bound Slasher Mask](//staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/2XlouLnDlK9k2YCP2iHsxU/89ab55e9a6bbdeba457dfee17bb69d18/-TD2-_News_-_-TUY8S3.2-_Red_Moon-2._Bound_Slasher_Mask.jpg)\n\n## LUNATIC MODIFIER \n\nEnemies entering combat have a chance to become **Lunatic**, gaining increased Damage and Rate of Fire. On death, Lunatic enemies explode, dealing damage across a large area. The blast’s damage is based on the hit that killed them. \n\n## MOON CULTISTS \n\nSome members of the Hyenas, True Sons, Outcasts, Black Tusk, and Underground have taken on a new identity as **Moon Cultists**. You’ll encounter them in groups as you explore D.C., with more coming after you during Heavy Storms and Blood Storms. \n\n## RED MOON UNLEASHED BOSSES AND SPECIAL CHALLENGE \n\nTake down enough **Moon Cultists**, and you may attract some unwanted attention. The Necromancer, Risen Hunter, and Bloody Houndsman are out there, each with rewards for those who survive the encounter. \n\nDefeating The Necromancer or Risen Hunter rewards you with one Event Key, but Bloody Houndsman does not drop one. Here’s the full reward breakdown for all three encounters: \n- **Necromancer** – guaranteed Bound Necromancer Mask, plus either an Exotic Cache (80% chance) or Sarru (20% chance). \n\n- **Risen Hunter** –  guaranteed Bound Risen Hunter Mask, plus either an Exotic Cache (80%) or Vertigo (20%). \n\n- **Bloody Houndsman** – guaranteed Bloody Houndsman Mask, Gloves, Backpack, Uniform, and Bat Drone Skill VFX. Plus, regular Hunter loot.\n\n![-TD2- News - -TUY8S3.2- Red Moon Unleashed, Creator Collaboration, Escalation Updates & More - Bound Risen Hunter Mask](//staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/1af3OXSI7u6Gp7CxNOtfX8/0510c2576f632e82efb4bb15545762dd/Bound_Risen_Hunter_Mask.jpg)\n\nVenture into West End while playing solo, and you risk meeting the Necromancer at his most dangerous. If he appears, you’ll face Necromancer Unleashed instead. \n\nBring him down on Heroic difficulty to claim one Event Key, the guaranteed Necromancer Hive Skill VFX, and either an Exotic Cache (80%) or Ouroboros (20%). \n\n## REVENANT BOUNTIES \n\nSix familiar enemies are back, with new looks to match the Red Moon. Defeat Moon Cultists across D.C. for a chance to pick up a Revenant Bounty, then follow it to your target. \n\nCompleting a bounty grants: \n- Event Key x1 \n- A 50% chance to receive a themed Arm Patch. \n- Either an Exotic Cache (80%) or the bounty's featured Exotic Weapon (20%)\n\n| BOUNTY NAME | BOUNTY BOSS | EXOTIC WEAPON |\n|:---|:---|:---|\n| Blinding The Eye | The Burning Eye | Eagle Bearer |\n| Final Girl | The Carver | Regulus |\n| Binding Circle | The Bound | Steel & Sons |\n| Rubber and Glue | The Mocker | Vindicator |\n| Scarecrow | The Raven | Prima Donna |\n| Dousing the Light | The Fool’s Light | The Bighorn |\n\nEliminate all six to complete the event commendation and earn the Necromancer Arm Patch. \n\n## EVENT VENDOR AND KEYS \n\n![-TD2- News - -TUY8S3.2- Red Moon-3. TD2 Red Moon Unleashed 2](//staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/7jNBbl0xBzOwyxg2bRCyzO/d23d334754aeaf303f7fc8f0f49d57b2/-TD2-_News_-_-TUY8S3.2-_Red_Moon-3._TD2_Red_Moon_Unleashed_2.jpg) \n\nThe Base of Operations is getting ready for Halloween too. Among the decorations, you’ll find the event vendor, where you can use your event keys to open Apparel and Gear Caches or contribute to Community Challenge. \n\n**You can earn Event Keys by:**\n- Defeating Moon Cultists \n- Taking down The Necromancer and Risen Hunter \n- Completing Revenant Bounties \n\nDefeating Moon Cultists awards an Event Key after a set number of kills, depending on difficulty: \n- **Normal:** 14 Kills \n- **Hard:** 14 Kills \n- **Challenging:** 12 Kills \n- **Heroic:** 10 Kills \n\n**The Daily Boost** halves these requirements for your first 150 Moon Cultist kills each day. Following your feedback, we’ve set a fixed daily reset time of 08:00 UTC, so you’ll know exactly when the boost refreshes. \n\nEnemies defeated during Revenant Bounties do not count toward these kill requirements, but completing a bounty awards one Event Key. \n\n## EVENT CACHES \n\n![-TD2- News - -TUY8S3.2- Red Moon-4. Red Moon Event Cache Breakdown](//staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/5nT8zRrswhKFicB6NDih65/acb55d472adad9860ce1671146ae465f/-TD2-_News_-_-TUY8S3.2-_Red_Moon-4._Red_Moon_Event_Cache_Breakdown.jpg)\n\n### APPAREL CACHES \n\nApparel Caches contain **43 items**, including pieces from **five outfits**, plus weapon and gear dyes: \n- The Burning Eye Outfit \n- The Burning Eye Weapon Skin x2 \n- The Bound Outfit \n- The Bound Weapon Skin \n- The Fool’s Light Outfit \n- The Carver Outfit \n- The Carver Weapon Skin \n- The Raven Outfit \n- The Raven Weapon Skin \n- The Mocker Outfit \n- The Mocker Weapon Skin \n- Red Moon Dye x5 \n\nCollect all items to unlock the completion reward: a special **The Necromancer Backpack Trophy**. \n\nYou can open Apparel Caches using gameplay keys or purchase **Apparel Keys for 100 Premium Credits each**. Purchased Apparel Keys can only be used on Apparel Caches. \n\n### GEAR CACHES \n\nGear Caches bring back seasonal rewards alongside Named items, Exotics, and Prototype gear. They’re also where you can find Lichtenberg, a new Named Classic M1A that rewards movement and headshots with a charged shot. \n\n|  |  |\n|:---|:---|\n| **Lichtenberg**<br>Named Classic M1A | **Talent Run and Gun**<br><br>**In PvE:**<br><br>While moving, you accrue **5** stacks per second, up to a maximum of **100** stacks.<br><br>Headshots with Lichtenberg grant **15** stacks and **20% Movement Speed** for 5 seconds.<br><br>While at maximum stacks, your next shot with Lichtenberg consumes all stacks, deals **200% bonus damage**, and **Shocks** the target for 2 second.<br><br>**In PvP:**<br><br>While moving, you accrue **5** stacks per second, up to a maximum of **100** stacks.<br><br>Headshots with Lichtenberg grant **10** stacks and **10% Movement Speed** for 3 seconds.<br><br>While at maximum stacks, your next shot with Lichtenberg consumes all stacks, deals **70% bonus damage**, and **Shocks** the target for 1 second. |\n\nThe Gear Cache reward pool includes: \n- **Prototype Lichtenberg Event Weapon** - 1% \n- **Prototype Gear Sets** - 1% \n- **Prototype Seasonal Named Items** - 1% \n- **Lichtenberg Event Weapon** - 7% \n- **Seasonal Exotics** - 25% \n- **Seasonal Named Items** - 30% \n  - Handbasket \n  - The Harvest \n  - Chill Out \n  - Sleigher \n  - Slingshot \n  - Oh Carol \n  - First Sight \n  - Quickstep \n  - Festive Delivery \n  - Snow Machine \n  - Bell Ringer \n  - First Bloom \n  - Rabid D50 \n- **Special Named Items** - 20% \n  - Stack Broker \n  - Lexington \n  - Turmoil \n  - Caretaker \n  - Shield Splinterer \n  - Huntsman \n  - Hunter-Killer \n- **Gear Mods** - 10% \n- **Skill Mods** - 5% \n\nThere’s more loot to find around the city. Look for **20 Red Moon Altars** in and around D.C.’s decorated areas. Destroying an altar grants loot from the Gear Cache reward pool, but may also attract another group of Moon Cultists. \n\nEach altar can be destroyed once per day, with all locations resetting at **08:00 UTC**. \n\n![-TD2- News - -TUY8S3.2- Red Moon-5. TD2 Red Moon Unleashed 3](//staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/2euiOyo0PmIXKZ6gxTMai6/8e24b5660ed395b8d2ecb75bca59cc02/-TD2-_News_-_-TUY8S3.2-_Red_Moon-5._TD2_Red_Moon_Unleashed_3.jpg)\n\n## COMMUNITY CHALLENGES \n\nDuring the Red Moon Unleashed Event, all Agents contribute to a shared, cross-platform Community Challenge. Progress unlocks exclusive rewards: \n- **3M Keys** – The Fool’s Light Jacket \n- **10M Keys** – The Fool’s Light Pants \n- **20M Keys** – The Fool’s Lantern Mask \n\nYour key contributions also advance a personal reward track, unlocking additional rewards as you reach individual milestones. At 200 keys, you’ll earn the special Sinister Spells Backpack Trophy, which adds a special visual touch to your outfit when equipped. \n- **10 Keys** – Sinister Spells Shirt \n- **20 Keys** – Scorpio \n- **40 Keys** - Sinister Spells Gloves \n- **60 Keys** – Scorpio Skin – BT Red Moon Unit \n- **80 Keys** – Sinister Spells Boots \n- **100 Keys** - Caretaker \n- **125 Keys** – Sinister Spells Pants \n- **150 Keys** – Caretaker Skin - Bloodstone \n- **175 Keys** – Sinister Spells Mask \n- **200 Keys** - Sinister Spells Backpack Trophy \n\n**Return to the Event Vendor at the BOO to claim completed Community Challenge rewards through the Community Cache** and remember to spend or donate your remaining Event Keys.  \n\nAny unused Event Keys will be removed when event ends, and unused Apparel Keys will be converted back into Premium Credits at 100 Premium Credits per key. \n\n# CONTENT CREATOR COLLABORATION {#2}\n\n![-TD2- News - -TUY8S3.2- Red Moon-6. Content Creator Collaboration Key Art](//staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/4Nokfrgh3a9cwUlS362Phm/507a7ecc9a6ce50bac5e00dde859cb17/-TD2-_News_-_-TUY8S3.2-_Red_Moon-6._Content_Creator_Collaboration_Key_Art.jpg)\n\nFrom **October 15** to **November 3**, we’re teaming up with **PurePrime**, **SOLIDFPS**, and **Widdz** for a new Creator Collaboration, with Project Chains to complete and creator-themed apparel to collect. \n\n## HOW IT WORKS \n\nEach creator has a chain of **six projects**, taking you through different Named Zones in D.C. Each project asks you to complete **five activities** in its designated zone. \n\nA new project is released in each chain daily. You’ll need to complete them in order, but there’s no need to finish each one on the day it arrives. Once released, projects remain available until the event ends on November 3. \n\n## REWARDS \n\nAs you progress through the projects, you’ll earn: \n- Named Item Caches \n- Exotic Components \n- Recalibration Caches \n- Optimization Caches \n\nComplete all six projects in a creator’s chain to unlock their themed backpack. \n\n## MORE TO COLLECT \n\nThere’s more creator apparel to find while exploring, with a **cap, T-shirt, and hoodie for each creator** available from loot containers throughout the game. \n\nKeep checking those containers while you’re out on patrol, and see if you can complete all three creator collections! \n\n# STATS AND RESOURCE MULTIPLIER EVENTS {#4}\n\n**Shepherd XP x3**\n- Runs from October 13 to October 20 \n- Climb the Shepherd ranks faster with triple Shepherd XP earned by answering calls for backup and helping other Agents. \n\n**Expertise Surge** \n- Runs from October 20 to October 27 \n- Advance your Expertise faster with double upgrade materials from all sources during the event. \n\n**Vanguard Overdrive** \n- Runs from October 27 to November 3 \n- The following bonuses are active for the duration of the event: \n  - +50% Reload Speed \n  - +50% Swap Speed \n  - +40% Hazard Protection \n  - +20% Movement Speed \n  - +15% Armor on Kill \n\n# CLASSIFIED ASSIGNMENTS {#5}\n\n![-TD2- News - -TUY8S3.2- Red Moon-8. The Georgetown Dead Zone CA](//staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/YQeDfK2jFo26F98UOg3pK/cdf5368bd2ed6785cef179bb4180e3cc/-TD2-_News_-_-TUY8S3.2-_Red_Moon-8._The_Georgetown_Dead_Zone_CA.jpg)\n\nRed Horizon’s second Classified Assignment, The Georgetown Dead Zone, opens on **October 15**. \n\nA JTF engineering team was sent to install new technology in an area of Georgetown beyond the reach of the SHD network. Now they’re missing, and it’s your turn to head in and find out what happened. \n\n# IMPROVEMENTS AND FIXES {#6}\n\n## ESCALATION \n\nWe’re adjusting Escalation’s token requirements and rewards following your feedback on token loss after disconnects and DELTA errors, and differences between hosts and teammates. \n\n**Starting an Escalation activity no longer consumes Escalation Tokens**. You still need a minimum **token balance** matching the tier you want to play: \n- **Tier 1:** 1 Token. \n- **Tier 5:** 5 Tokens. \n- **Tier 10:** 10 Tokens. \n\nThe same rule applies to every tier and to matchmaking. These tokens remain in your inventory, including if the activity fails or you disconnect, **so you won’t lose an entry fee when a run ends unexpectedly**. \n\n**Remember to keep the required balance when spending tokens at the vendor**. If your balance falls below a tier’s requirement, you’ll need to earn more tokens before you can start or matchmake into that tier again. \n\nThese adjustments are part of our ongoing work on Escalation, with more improvements planned for next season. \n\n### UPDATED TOKEN REWARDS \n\nHosts and teammates now receive the same number of Escalation Tokens for completing an activity. Completion rewards have been adjusted alongside the removal of the entry cost: \n- **Tier 0:** 1 Token \n- **Tier 1:** 2 Tokens \n- **Tier 2:** 3 Tokens \n- **Tier 3:** 4 Tokens \n- **Tier 4:** 5 Tokens \n- **Tier 5:** 7 Tokens \n- **Tier 6:** 9 Tokens \n- **Tier 7:** 12 Tokens \n- **Tier 8:** 17 Tokens \n- **Tier 9:** 22 Tokens \n- **Tier 10:** 30 Token \n\nPrices at the **Escalation Requisition Vendor** remain unchanged. \n\n## CONFLICT \n\nYou’ll now have more choice over your rewards in Conflict. Complete matches and rank up to earn **Conflict Commendation Currency** (CCC), then spend it on High–End gear, weapons, Exotics, and Prototypes and items at the new **Prometheus Terminal**.  \n\n### RANKS AND REWARDS \n\nThe Conflict Rank cap is increasing from **100** to **200**. Each rank above 100 requires the same amount of XP as Rank 100. \n\nEvery rank-up award **45 CCC**. At milestones every five ranks, the rewards is **45 CCC and a Milestone Cache**, with the **cache type** depending on your rank: \n- **Rank 5 to 30:** Conflict Cache \n- **Rank 35 to 70:** Conflict Specialist Cache \n- **Rank 75 to 95:** DZ Exotic Component Cache \n- **Rank 100:** DZ Prototype Cache \n- **Rank 105 to 120:** Conflict Cache \n- **Rank 125 to 130:** DZ Prototype Cache \n- **Rank 135 to 165:** Conflict Specialist Cache \n- **Rank 170 to 175:** DZ Exotic Component Cache \n- **Rank 180 to 200:** DZ Prototype Cache \n\nThe existing cosmetic rewards remain on the Conflict track, but now unlock at the ranks listed below. Each reward also comes with an **additional Conflict Cache**. \n- **Rank 12:** Rogue Boots \n- **Rank 22:** Rogue Pants \n- **Rank 32:** Rogue Shirt \n- **Rank 42:** Rogue Scarf \n- **Rank 52:** Rogue Shades \n- **Rank 62:** Rogue Bandana \n- **Rank 72:** Major League Gear Dye \n- **Rank 82:** MVP Weapon Skin \n- **Rank 92:** Challenger Patch \n- **Rank 102:** Conflict Trophy \n\nCCC also replaces the caches previously awarded at the end of Conflict matches. You’ll earn **30 CCC for a loss** or **60 CCC for a win**, plus **45 CCC whenever you rank up**. \n\n### PROMETHEUS TERMINAL \n\nAn unknown network has overridden local systems, and the Prometheus Terminal us now active beneath the helipad at the BOO. Head there to spend your CCC on high-tier equipment.  \n\nThe terminal unlocks at **Character Level 15**, and its items scale up to **Level 40**. \n\n**Caches:** \n- Conflict Cache  \n- Conflict Specialist Cache  \n- DZ Exotic Component Cache  \n- Reconstructed Cache  \n- DZ Prototype Cache \n\n**Direct-Buy (Daily Rotation):** \n- 2x High-Roll Named Weapons  \n- 2x High-Roll Named Gear Pieces  \n- 2x High-Roll Gear Set Pieces  \n- 2x High-Roll Gear / Skill Mods  \n- 1x Random Exotic (Weapon/Gear)  \n- 1x Random Prototype (Weapon/Gear) \n\nA new **Comm Log** can be found near the terminal. Its audio is reduced to static, but a data string remains on-screen. \n\n## GEAR UPDATES \n\nRifles and Marksman Rifle users will have 20% more ammo to work with. Selected weapons will also receive handling adjustments focused on Stability. We’re also increasing Critical Hit Damage and Headshot Damage bonuses on Rifles and making changes to several Exotic weapons and gear pieces. \n\nCheck the [full gear updates breakdown](https://ubi.li/SlCDg) to see what’s changing for your build. \n\nThese updates apply in both **PvE and PvP**, except for **talent value changes, which only affect PvE**.  \n\n## PVP GEAR AND BRAND BONUSES \n\nWe’re also making another round of improvements to gear and brand bonuses specifically for PvP. You’ll find all the details in the [PvP Gear and Brand Bonus rebalance notes](https://ubi.li/2Ldwf).  \n\n## FIXES \n\n### Gameplay\n\n- Overdrive Micro Event stat multipliers are now disabled in all Conflict matches. \n- Fixed an issue where Red Moon bosses dropped regular items instead of contaminated items in the PvE Dark Zone. [[TCTD2-7508](https://www.ubisoft.com/en-us/game/the-division/the-division-2/bug-reporter/issues/TCTD2-7508)] \n- Fixed an issue where progress on Retaliation Anniversary Projects reset every hour. [[TCTD2-7527](https://www.ubisoft.com/en-us/game/the-division/the-division-2/bug-reporter/issues/TCTD2-7527)] \n- Fixed an issue with Movement Speed bonus stacking. Bonuses from sources such as Quickstep, Acosta, and Lady Death now stack additively, with the total Movement Speed bonus capped at 20%. \n- Fixed an issue where the following Exotics dropped more often than intended after defeating Phoebe: Capacitor, Nemesis, Dread Edict, Liberty, Chatterbox, Ridgeway’s Pride, Dodge City Gunslinger, Catharsis, Overlord, and Acosta’s Kneepads. \n\n### Skills \n- Fixed an issue where Agents were not protected from Sticky Bomb skills while inside Conflict spawn zones. \n- Fixed an issue where the Incendiary Turret’s visual effect extended beyond its actual damage radius and placement indicator. \n\n### UI \n- Fixed an issue where the Striker’s Gamble stack counter displayed 300 instead of 200 when entering the Dark Zone. \n- Fixed an issue where the amount of DZ Resources obtained from deconstructing contaminated gear during DZ Surge was displayed incorrectly.  \n- Fixed an issue where completing a Supply Drop in any Dark Zone incorrectly displayed NinjaBike Messenger Kneepads as a reward. \n- Fixed an issue where the Library of Congress Retrieval Classified Assignment displayed an incorrect collectible count of 6/5. [[TCTD2 – 4533](https://www.ubisoft.com/en-us/game/the-division/the-division-2/bug-reporter/issues/TCTD2-4533)] \n- Fixed an issue where the map displayed an incorrect timer for the free Classified Assignment. [[TCTD2-6076](https://www.ubisoft.com/en-us/game/the-division/the-division-2/bug-reporter/issues/TCTD2-6076)] \n\n<hr/>\n\nIf you encounter any issues you’d like to report, please use our [Bug Reporter](https://www.ubisoft.com/en-us/game/the-division/the-division-2/bug-reporter). \n\nStay sharp out there, Agents. \n\n**/ The Division 2 Team** ","abstract":"The Necromancer has been digging through The Division’s past. Now the results are roaming the streets.","button":{"trackingValue":"7uzKuy4iB0MtOJfsXAr3TO : [TD2] News - [TUY8S3.2] Red Moon Unleashed, Creator Collaboration, Escalation Updates & More","buttonUrl":"/7uzKuy4iB0MtOJfsXAr3TO/tuy8s32-red-moon-unleashed-creator-collaboration-escalation-updates-more","trackingCategoryValue":"news","commonTranslationId":"readMore","buttonType":"internal"},"date":"Tue Oct 13 2026 15:45:00 GMT+0000 (Coordinated Universal Time)","trackingPageValue":"[TD2] News - [TUY8S3.2] Red Moon Unleashed, Creator Collaboration, Escalation Updates & More","title":"[TUY8S3.2] Red Moon Unleashed, Creator Collaboration, Escalation Updates & More","id":"7uzKuy4iB0MtOJfsXAr3TO","categories":["the-division","the-division-2"],"placement":null,"thumbnail":{"description":"","url":"https://staticctf.ubisoft.com/J3yJr34U2pZ2Ieem48Dwy9uqj5PNUQTn/1p72lI7Ulak6A0YUgJCD2g/85ff62d4b60266135f69af560fe173d7/-TD2-_News_-_-TUY8S3.2-_Red_Moon-Red_Moon_Unleashed_Event_Thumbnail.jpg"},"type":"news","readTime":17,"authors":null,"tag":"BR-the-division GA-the-division-2"},{"button":{"trackingValue":"MsAVpwIDHHI : the-division-2-red-moon-unleashed-event-teaser","buttonType":"youtube-modal","commonTranslationId":"watchNow","buttonUrl":"MsAVpwIDHHI?cc_lang_pref=en&cc_load_policy=1&hl=en","trackingCategoryValue":"videos"},"thumbnail":{"description":"The Division 2: Red Moon Unleashed Event Teaser","url":"https://i.ytimg.com/vi/MsAVpwIDHHI/maxresdefault.jpg"},"date":"2026-10-13T13:30:33.000Z","categories":["the-division-2"],"type":"videos","description":"Agents, the Red Moon is spreading beyond the Dark Zones and taking over Washington D.C.\n\nAs Blood Storms sweep through the city, new terrors emerge. Confront six Red Moon Reverants led by The Necromancer, face a deadly new Hunter, and battle multi-faction kill squads across D.C.\n\nComplete community challenges, earn event rewards, and unlock Twitch Drops during the Red Moon Unleashed event from October 15 to November 3.","tag":"BR-the-division GA-the-division-2","id":"MsAVpwIDHHI","title":"The Division 2: Red Moon Unleashed Event Teaser","trackingPageValue":"the-division-2-red-moon-unleashed-event-teaser","content":"[video](https://www.youtube-nocookie.com/embed/MsAVpwIDHHI?cc_lang_pref=en&cc_load_policy=1&hl=en)"}]}}};</script></body></html>
