# Cloudflare Pages project (static site in dist/ + functions/ for /api/live, /api/loot and the visit counter).
# Secrets are NOT stored here: set TWITCH_CLIENT_ID / TWITCH_CLIENT_SECRET in the Pages project settings
# (or `wrangler pages secret put NAME --project-name dc-dispatch`).
name = "dc-dispatch"
pages_build_output_dir = "dist"
compatibility_date = "2026-10-01"

# Visit counter (functions/lib/views.ts). The namespace already exists in Cloudflare.
[[kv_namespaces]]
binding = "VIEWS"
id = "29e65aa1a4ef419baad5b43ea3410405"
