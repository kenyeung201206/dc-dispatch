name: Stale edition watchdog

# Fails (GitHub then notifies the repo owner by its normal notification settings)
# if no new edition has been committed for 36 hours — e.g. when the daily job is disabled or broken.
on:
  schedule:
    - cron: '0 3,15 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - run: node scripts/check-stale.ts 36
