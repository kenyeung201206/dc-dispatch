name: Daily edition

# Every 2 hours (UTC 00, 02, …, 22 = Tokyo 09, 11, …, 07). Same-day runs update that day's edition (same
# edition number). YouTube quota per run: 3 searches x 100 + ~25 followed creators x 2 + 灰帽特工 x 2 + Watch Now
# channels ~10 = about 360 units, x 12 runs = about 4,300 of 10,000/day. Free Actions minutes: ~1-2 min/run.
# The 重點整理 writer starts right after each run (Claude routine, GitHub push trigger).
# Also runnable by hand from the Actions tab.
on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write # commit the new edition back to the repo

concurrency:
  group: daily-edition
  cancel-in-progress: false

env:
  ASTRO_TELEMETRY_DISABLED: '1'

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Keeps ETag/Last-Modified caches between runs so unchanged sources aren't re-downloaded.
      - uses: actions/cache@v6.1.0
        with:
          path: data/cache
          key: http-cache-${{ github.run_id }}
          restore-keys: http-cache-

      - name: Fetch today's news
        run: pnpm run refresh
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          AI_DAILY_BUDGET_USD: ${{ vars.AI_DAILY_BUDGET_USD }}

      - name: Check
        run: pnpm run i18n:check && pnpm run test

      - name: Build site + search index
        run: pnpm run build
        env:
          HUMOUR_LEVEL: ${{ vars.HUMOUR_LEVEL || 'medium' }}

      - name: Commit the edition
        run: |
          git config user.name "dc-dispatch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/editions data/images.json data/patches.json data/videos.json data/status.json data/exotics.json data/guides.json data/events.json data/creator-posts.json data/briefs.zh.json data/source-notes.json data/daily-loot.json data/brands.json data/places.json data/hot-topics.json public/icons
          if [ -f data/ai-cache.json ]; then git add data/ai-cache.json; fi
          if git diff --cached --quiet; then echo "No data changes"; else
            git commit -m "chore(data): edition $(TZ=Asia/Tokyo date +%F)"
            # Another run (or a code push) may have landed meanwhile: catch up and retry.
            # -X theirs keeps THIS run's data files if both runs touched the same edition (this run is newer).
            for attempt in 1 2 3; do
              if git push; then break; fi
              echo "Push rejected (attempt $attempt); rebasing on the latest main"
              git pull --rebase -X theirs origin main
              if [ "$attempt" = 3 ]; then git push; fi
            done
          fi

      - name: Deploy to Cloudflare Pages
        if: ${{ vars.CF_PAGES_PROJECT != '' }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Cloudflare secrets not set yet — edition committed but not deployed. See docs/DEPLOY.md step 4."
            exit 0
          fi
          pnpm exec wrangler pages deploy dist --project-name="${{ vars.CF_PAGES_PROJECT }}" --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Fail loudly if the paper is stale
        run: node scripts/check-stale.ts 36
