name: Daily edition

# Every 2 hours. GitHub often delays or drops scheduled runs, worst at the top of the hour (2026-11-18: 10 h with no
# update, and no run failed — they never started). So: the main time is :17 (quieter), with backup times at :47 and
# on odd hours. Every scheduled start first checks data/status.json: it only runs the robot when the last update is
# 100+ minutes old, so backups cost seconds and no YouTube quota when the main run happened. Last resort: the hourly
# self-repair routine (Anthropic's scheduler) touches data/trigger/refresh.txt when the paper is 3+ hours old, and
# that push starts this workflow. Same-day runs update that day's edition (same
# edition number). YouTube quota per run: 5 searches x 101 (50 results each, last 24 h) + followed creators x 2
# (25 now, auto-grows to at most 60: pipeline/video/discover.ts) + Watch Now channels ~10 = about 580-650 units,
# x 12 runs = about 7,000-7,800 of 10,000/day. Free Actions minutes: ~1-2 min/run.
# The 重點整理 writer starts right after each run (Claude routine, GitHub push trigger).
# Also runnable by hand from the Actions tab.
on:
  schedule:
    - cron: '17 */2 * * *' # main: even hours UTC
    - cron: '47 */2 * * *' # backup, 30 min later
    - cron: '17 1-23/2 * * *' # backup, odd hours
  push:
    branches: [main]
    paths: [data/trigger/refresh.txt] # self-repair fallback (docs/SELF_REPAIR.md)
  workflow_dispatch:

permissions:
  contents: write # commit the new edition back to the repo
  actions: read # publish-gate: did this code already pass CI?

env:
  ASTRO_TELEMETRY_DISABLED: '1'

jobs:
  # Is an update due? Scheduled and fallback starts run the robot only when the last one is 100+ minutes old.
  # (Outside the concurrency group, so a skipped check never takes the queue place of a real run.)
  due:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      run: ${{ steps.age.outputs.run }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: data/status.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - id: age
        run: |
          mins=$(node -e "console.log(Math.round((Date.now()-Date.parse(require('./data/status.json').lastRun))/60000))")
          echo "Last update $mins minutes ago (event: $EVENT)"
          if [ "$EVENT" = "workflow_dispatch" ] || [ "$mins" -ge 100 ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi
        env:
          EVENT: ${{ github.event_name }}

  refresh:
    needs: due
    if: needs.due.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: daily-edition
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 60 # publish-gate compares the code with recent commits that passed CI
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Keeps ETag/Last-Modified caches between runs so unchanged sources aren't re-downloaded.
      - uses: actions/cache@v6.1.0
        with:
          path: data/cache
          key: http-cache-${{ github.run_id }}
          restore-keys: http-cache-

      - name: Fetch today's news
        run: pnpm run refresh
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          AI_DAILY_BUDGET_USD: ${{ vars.AI_DAILY_BUDGET_USD }}

      # A failed check doesn't stop the paper by itself: publish-gate decides (see scripts/publish-gate.ts).
      - name: Check
        id: check
        continue-on-error: true
        run: |
          set -o pipefail
          (pnpm run i18n:check && pnpm run test && node scripts/check-duplicate-titles.ts) 2>&1 | tee check.log

      - name: Decide whether to publish
        id: gate
        run: node scripts/publish-gate.ts "${{ steps.check.outcome }}" check.log
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build site + search index
        if: steps.gate.outputs.publish == 'true'
        run: pnpm run build
        env:
          HUMOUR_LEVEL: ${{ vars.HUMOUR_LEVEL || 'medium' }}

      - name: Commit the edition
        if: steps.gate.outputs.publish == 'true'
        run: |
          git config user.name "dc-dispatch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/editions data/images.json data/patches.json data/videos.json data/status.json data/exotics.json data/guides.json data/events.json data/creator-posts.json data/briefs.zh.json data/source-notes.json data/daily-loot.json data/brands.json data/places.json data/hot-topics.json data/video-channels.json data/problems.json public/icons
          if [ -f data/ai-cache.json ]; then git add data/ai-cache.json; fi
          if git diff --cached --quiet; then echo "No data changes"; else
            git commit -m "chore(data): edition $(TZ=Asia/Taipei date +%F)"
            # Another run (or a code push) may have landed meanwhile: catch up and retry.
            # -X theirs keeps THIS run's data files if both runs touched the same edition (this run is newer).
            for attempt in 1 2 3; do
              if git push; then break; fi
              echo "Push rejected (attempt $attempt); rebasing on the latest main"
              git pull --rebase -X theirs origin main
              if [ "$attempt" = 3 ]; then git push; fi
            done
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.gate.outputs.publish == 'true' && vars.CF_PAGES_PROJECT != ''
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Cloudflare secrets not set yet — edition committed but not deployed. See docs/DEPLOY.md step 4."
            exit 0
          fi
          # Cloudflare sometimes rejects an upload: try again (3 tries, 30 s / 90 s apart).
          for attempt in 1 2 3; do
            if pnpm exec wrangler pages deploy dist --project-name="${{ vars.CF_PAGES_PROJECT }}" --branch=main --commit-dirty=true; then exit 0; fi
            echo "::warning::Deploy rejected (attempt $attempt)"; [ "$attempt" = 3 ] || sleep $((attempt * 30 + (attempt - 1) * 30))
          done
          echo "::error::Cloudflare rejected the deploy 3 times. The edition is committed; the next run deploys it."; exit 1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Fail loudly if the paper is stale
        if: steps.gate.outputs.publish == 'true'
        run: node scripts/check-stale.ts 36

      # Plain-language report. Failing here makes GitHub email the owner; the auto-retry (retry.yml) skips
      # runs that failed only at this step, since the paper was already published.
      - name: Report problems
        if: always() && steps.gate.outputs.reason != ''
        run: |
          echo "::error::$REASON"
          exit 1
        env:
          REASON: ${{ steps.gate.outputs.reason }}
