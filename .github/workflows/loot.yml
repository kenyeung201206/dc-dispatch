name: Daily loot

# The 今日戰鬥升級 box, right after the game's daily reset (08:00 UTC = 17:00 Tokyo). Reads ProtoTrack.gg's
# plain-text file (usually saved ~2 min after reset), retrying every 3 min for up to ~45 min, then builds and
# deploys only if the list changed. No YouTube calls, so no API quota. ~3-5 Actions minutes a day.
# GitHub may start a scheduled run a few minutes late. The 2-hourly "Daily edition" run also checks the loot.
on:
  schedule:
    - cron: '3 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

# Same group as the edition run, so the two never push or deploy at the same time.
concurrency:
  group: daily-edition
  cancel-in-progress: false

env:
  ASTRO_TELEMETRY_DISABLED: '1'

jobs:
  loot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Fetch today's loot
        id: loot
        run: node pipeline/loot.ts

      - name: Build site + search index
        if: steps.loot.outputs.changed == 'true'
        run: pnpm run build
        env:
          HUMOUR_LEVEL: ${{ vars.HUMOUR_LEVEL || 'medium' }}

      - name: Commit the loot
        if: steps.loot.outputs.changed == 'true'
        run: |
          git config user.name "dc-dispatch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily-loot.json
          git commit -m "chore(data): 戰鬥升級 $(date -u +%F)"
          for attempt in 1 2 3; do
            if git push; then break; fi
            echo "Push rejected (attempt $attempt); rebasing on the latest main"
            git pull --rebase -X theirs origin main
            if [ "$attempt" = 3 ]; then git push; fi
          done

      - name: Deploy to Cloudflare Pages
        if: steps.loot.outputs.changed == 'true' && vars.CF_PAGES_PROJECT != ''
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Cloudflare secrets not set — loot committed but not deployed."
            exit 0
          fi
          pnpm exec wrangler pages deploy dist --project-name="${{ vars.CF_PAGES_PROJECT }}" --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
