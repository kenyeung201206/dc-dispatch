name: Daily loot

# The 今日戰鬥升級 list, after the game's daily reset (08:00 UTC = 16:00 Taiwan/HK time). Checks ProtoTrack.gg's
# plain-text file at 16:10 and 16:20 Taiwan/HK time, and builds and deploys only if the list changed. No YouTube calls,
# so no API quota; ~1 Actions minute a run. GitHub often starts scheduled runs late (sometimes by an hour), so this
# is the backup: the front-page box reads ProtoTrack live through /api/loot. The 2-hourly edition run also checks.
on:
  schedule:
    - cron: '10 8 * * *'
    - cron: '20 8 * * *'
  workflow_dispatch:
    inputs:
      deploy:
        description: Build and deploy even if the list didn't change (e.g. after a code or icon update)
        type: boolean
        default: false

permissions:
  contents: write

# Same group as the edition run, so the two never push or deploy at the same time.
concurrency:
  group: daily-edition
  cancel-in-progress: false

env:
  ASTRO_TELEMETRY_DISABLED: '1'

jobs:
  loot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Fetch today's loot
        id: loot
        run: node pipeline/loot.ts

      - name: Build site + search index
        if: steps.loot.outputs.changed == 'true' || inputs.deploy
        run: pnpm run build
        env:
          HUMOUR_LEVEL: ${{ vars.HUMOUR_LEVEL || 'medium' }}

      - name: Commit the loot
        if: steps.loot.outputs.changed == 'true'
        run: |
          git config user.name "dc-dispatch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily-loot.json data/brands.json data/places.json public/icons
          git commit -m "chore(data): 戰鬥升級 $(date -u +%F)"
          for attempt in 1 2 3; do
            if git push; then break; fi
            echo "Push rejected (attempt $attempt); rebasing on the latest main"
            git pull --rebase -X theirs origin main
            if [ "$attempt" = 3 ]; then git push; fi
          done

      - name: Deploy to Cloudflare Pages
        if: (steps.loot.outputs.changed == 'true' || inputs.deploy) && vars.CF_PAGES_PROJECT != ''
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Cloudflare secrets not set — loot committed but not deployed."
            exit 0
          fi
          for attempt in 1 2 3; do
            if pnpm exec wrangler pages deploy dist --project-name="${{ vars.CF_PAGES_PROJECT }}" --branch=main --commit-dirty=true; then exit 0; fi
            echo "::warning::Deploy rejected (attempt $attempt)"; [ "$attempt" = 3 ] || sleep $((attempt * 30 + (attempt - 1) * 30))
          done
          echo "::error::Cloudflare rejected the deploy 3 times. Readers still get today's list live from /api/loot."; exit 1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
