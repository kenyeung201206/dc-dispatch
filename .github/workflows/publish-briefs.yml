name: Publish write-ups

# When the scheduled 重點整理 writer (docs/BRIEF_WRITER.md) pushes new write-ups, rebuild and publish the
# site right away instead of waiting for the next 2-hourly edition. (The robot's own pushes use the
# workflow token, which never starts other workflows, so this can't loop.)
on:
  push:
    branches: [main]
    paths:
      - data/briefs.zh.json
      - data/translations.zh.json
      - data/term-names.json
      - data/skipped-stories.json

permissions:
  contents: read
  actions: read # publish-gate: did this code already pass CI?

concurrency:
  group: daily-edition
  cancel-in-progress: false

env:
  ASTRO_TELEMETRY_DISABLED: '1'

jobs:
  publish:
    if: ${{ vars.CF_PAGES_PROJECT != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 60 # publish-gate compares the code with recent commits that passed CI
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Same safe mode as the robot (scripts/publish-gate.ts): a check that fails because of the day's data
      # must not hold back the Chinese write-ups (2026-11-13: one missing exotic name blocked them all day).
      - name: Check
        id: check
        continue-on-error: true
        run: |
          set -o pipefail
          (pnpm run i18n:check && pnpm run test && node scripts/check-duplicate-titles.ts) 2>&1 | tee check.log
      - name: Decide whether to publish
        id: gate
        run: node scripts/publish-gate.ts "${{ steps.check.outcome }}" check.log
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Build site + search index
        if: steps.gate.outputs.publish == 'true'
        run: pnpm run build
        env:
          HUMOUR_LEVEL: ${{ vars.HUMOUR_LEVEL || 'medium' }}
      - name: Deploy to Cloudflare Pages
        if: steps.gate.outputs.publish == 'true'
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Cloudflare secrets not set — not deployed."
            exit 0
          fi
          for attempt in 1 2 3; do
            if pnpm exec wrangler pages deploy dist --project-name="${{ vars.CF_PAGES_PROJECT }}" --branch=main --commit-dirty=true; then exit 0; fi
            echo "::warning::Deploy rejected (attempt $attempt)"; [ "$attempt" = 3 ] || sleep $((attempt * 30 + (attempt - 1) * 30))
          done
          echo "::error::Cloudflare rejected the deploy 3 times."; exit 1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Report problems
        if: always() && steps.gate.outputs.reason != ''
        run: |
          echo "::error::$REASON"
          exit 1
        env:
          REASON: ${{ steps.gate.outputs.reason }}
